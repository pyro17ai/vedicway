name: ${COMPOSE_PROJECT_NAME:-vedicway}

x-backend-common: &backend-common
  image: ${BACKEND_IMAGE:-vedicway-backend}:${RELEASE_TAG:-local}
  build:
    context: .
    dockerfile: docker/backend/Dockerfile
    args:
      CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:-0.144.6}
    additional_contexts:
      pyjhora: ${PYJHORA_WHEELHOUSE_DIR:?Set PYJHORA_WHEELHOUSE_DIR to a verified Linux wheelhouse}
  env_file:
    - .env.production
  environment: &backend-environment
    VEDICWAY_ENV: production
    VEDICWAY_TEST_PAYMENTS: ${VEDICWAY_TEST_PAYMENTS:-0}
    VEDICWAY_ALLOW_PRODUCTION_TEST_PAYMENTS: ${VEDICWAY_ALLOW_PRODUCTION_TEST_PAYMENTS:-0}
    VEDICWAY_PAYMENT_PROVIDER: ${VEDICWAY_PAYMENT_PROVIDER:-yookassa}
    VEDICWAY_INTERPRETATION_PROVIDER: codex
    VEDICWAY_INLINE_WORKER: "0"
    VEDICWAY_DATA_DIR: /var/lib/vedicway/data
    VEDICWAY_MEDIA_DIR: /var/lib/vedicway/media
    VEDICWAY_CODEX_HOME: /var/lib/vedicway/codex-home
    VEDICWAY_AGENT_WORKDIR: /var/lib/vedicway/agent-workdir
    VEDICWAY_CODEX_EXECUTABLE: /usr/local/bin/codex
    VEDICWAY_CHROMIUM_NO_SANDBOX: "1"
    VEDICWAY_PLACE_DATASET_PATH: /run/config/places.json
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-vedicway}
    POSTGRES_USER: ${POSTGRES_USER:-vedicway}
    POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    VEDICWAY_DATA_KEY_FILE: /run/secrets/vedicway_data_key
    VEDICWAY_SIGNING_KEY_FILE: /run/secrets/vedicway_signing_key
    FORWARDED_ALLOW_IPS: ${VEDICWAY_TRUSTED_PROXY_CIDRS:-172.29.0.0/24,172.30.0.0/28,172.22.0.1/32,92.53.96.169/32}
    VEDICWAY_TRUSTED_PROXY_CIDRS: ${VEDICWAY_TRUSTED_PROXY_CIDRS:-172.29.0.0/24,172.30.0.0/28,172.22.0.1/32,92.53.96.169/32}
    VEDICWAY_OPERATIONS_CIDRS: ${VEDICWAY_OPERATIONS_CIDRS:-127.0.0.1/32},${VEDICWAY_OPS_DOCKER_SUBNET:-172.30.0.0/28}
  configs:
    - source: places
      target: /run/config/places.json
      mode: 0444
  volumes: &backend-volumes
    - runtime_data:/var/lib/vedicway/data
    - media_data:/var/lib/vedicway/media
    - type: bind
      source: ${PYJHORA_EPHEMERIS_DIR:?Set PYJHORA_EPHEMERIS_DIR to the pinned PyJHora ephemeris directory}
      target: /opt/venv/lib/python3.11/site-packages/jhora/data/ephe
      read_only: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=1770
    - /var/lib/vedicway/codex-home:rw,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
    - /var/lib/vedicway/agent-workdir:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0500
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 512
  shm_size: 256m
  init: true
  restart: unless-stopped
  stop_grace_period: 45s

x-lifecycle-common: &lifecycle-common
  image: ${BACKEND_IMAGE:-vedicway-backend}:${RELEASE_TAG:-local}
  profiles: ["ops"]
  env_file:
    - .env.production
  environment:
    VEDICWAY_ENV: production
    VEDICWAY_SECRET_PROFILE: lifecycle
    VEDICWAY_DATA_DIR: /var/lib/vedicway/data
    VEDICWAY_DATA_KEY_FILE: /run/secrets/vedicway_data_key
    VEDICWAY_SIGNING_KEY_FILE: /run/secrets/vedicway_signing_key
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-vedicway}
    POSTGRES_USER: ${POSTGRES_USER:-vedicway}
    POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  secrets:
    - postgres_password
    - vedicway_data_key
    - vedicway_signing_key
  volumes:
    - runtime_data:/var/lib/vedicway/data
  networks:
    - data
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1770
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 64
  healthcheck:
    disable: true
  restart: "no"

services:
  postgres:
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vedicway}
      POSTGRES_USER: ${POSTGRES_USER:-vedicway}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 60s

  content-migrate:
    image: ${BACKEND_IMAGE:-vedicway-backend}:${RELEASE_TAG:-local}
    entrypoint: ["/usr/local/bin/vedicway-run-alembic"]
    user: "10001:10001"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-vedicway}
      POSTGRES_USER: ${POSTGRES_USER:-vedicway}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    networks:
      - data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001,mode=1770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend-common
    environment:
      <<: *backend-environment
      VEDICWAY_SECRET_PROFILE: api
      VEDICWAY_OPERATIONS_TOKEN_FILE: /run/secrets/vedicway_operations_token
      VEDICWAY_METRICS_TOKEN_FILE: /run/secrets/vedicway_metrics_token
      VEDICWAY_SEO_AGENT_TOKEN_FILE: /run/secrets/vedicway_seo_agent_token
      YOOKASSA_SHOP_ID_FILE: /run/secrets/yookassa_shop_id
      YOOKASSA_SECRET_KEY_FILE: /run/secrets/yookassa_secret_key
    secrets:
      - postgres_password
      - vedicway_data_key
      - vedicway_signing_key
      - vedicway_operations_token
      - vedicway_metrics_token
      - vedicway_seo_agent_token
      - yookassa_shop_id
      - yookassa_secret_key
    networks:
      - edge
      - data
      - api-egress
      - ops
    depends_on:
      content-migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend-common
    command: ["python", "-m", "vedicway_backend.worker"]
    environment:
      <<: *backend-environment
      VEDICWAY_SECRET_PROFILE: worker
      VEDICWAY_INLINE_WORKER: "0"
      CODEX_AUTH_FILE: /run/secrets/codex_auth
    secrets:
      - postgres_password
      - vedicway_data_key
      - vedicway_signing_key
      - codex_auth
    volumes: *backend-volumes
    networks:
      - data
      - worker-egress
    healthcheck:
      disable: true
    depends_on:
      content-migrate:
        condition: service_completed_successfully

  seo-agent:
    image: ${BACKEND_IMAGE:-vedicway-backend}:${RELEASE_TAG:-local}
    profiles: ["seo"]
    command: ["python", "-m", "seo_agent.scheduler", "daemon"]
    working_dir: /opt/vedicway
    user: "10001:10001"
    env_file:
      - .env.production
    environment:
      VEDICWAY_ENV: production
      VEDICWAY_SECRET_PROFILE: seo-agent
      VEDICWAY_SEO_AGENT_ENABLED: ${VEDICWAY_SEO_AGENT_ENABLED:-0}
      VEDICWAY_SEO_AGENT_BASE_URL: http://backend:8000
      VEDICWAY_SEO_DATA_DIR: /var/lib/vedicway/seo-agent
      VEDICWAY_SEO_AGENT_WORKDIR: /opt/vedicway
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-vedicway}
      POSTGRES_USER: ${POSTGRES_USER:-vedicway}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      VEDICWAY_CODEX_EXECUTABLE: /usr/local/bin/codex
      VEDICWAY_CODEX_SERVICE_TIER: ${VEDICWAY_CODEX_SERVICE_TIER:-fast}
      VEDICWAY_SEO_JOB_TIMEOUT_SECONDS: ${VEDICWAY_SEO_JOB_TIMEOUT_SECONDS:-3600}
      VEDICWAY_SEO_MIN_ARTICLE_CHARS: ${VEDICWAY_SEO_MIN_ARTICLE_CHARS:-4500}
      VEDICWAY_PUBLIC_ORIGIN: ${VEDICWAY_PUBLIC_ORIGIN}
      VEDICWAY_DZEN_CDP_URL: http://vedicway-seo-browser-dzen:9322
      VEDICWAY_PINTEREST_CDP_URL: http://vedicway-seo-browser-pinterest:9325
      VEDICWAY_YANDEX_HOST_ID: ${VEDICWAY_YANDEX_HOST_ID:-}
      VEDICWAY_METRIKA_COUNTER_ID: ${VEDICWAY_METRIKA_COUNTER_ID:-}
      VEDICWAY_SEO_CODEX_HOME: /var/lib/vedicway/seo-codex-home
      VEDICWAY_CODEX_HOME: /var/lib/vedicway/seo-codex-home
      CODEX_AUTH_FILE: /run/secrets/codex_auth
      VEDICWAY_SEO_AGENT_TOKEN_FILE: /run/secrets/vedicway_seo_agent_token
      VEDICWAY_YANDEX_SEARCH_API_KEY_FILE: /run/secrets/yandex_search_api_key
      VEDICWAY_YANDEX_FOLDER_ID_FILE: /run/secrets/yandex_folder_id
      VEDICWAY_YANDEX_WEBMASTER_TOKEN_FILE: /run/secrets/yandex_webmaster_token
      VEDICWAY_YANDEX_METRIKA_TOKEN_FILE: /run/secrets/yandex_metrika_token
      VEDICWAY_VK_GROUP_ID: ${VEDICWAY_VK_GROUP_ID:-}
      VEDICWAY_VK_GROUP_ACCESS_TOKEN_FILE: /run/secrets/vedicway_vk_group_access_token
      VEDICWAY_VK_USER_ACCESS_TOKEN_FILE: /run/secrets/vedicway_vk_user_access_token
      VEDICWAY_PINTEREST_BOARD_NAME: ${VEDICWAY_PINTEREST_BOARD_NAME:-}
      CODEX_HOME: /var/lib/vedicway/seo-codex-home
      HOME: /var/lib/vedicway/seo-codex-home
      PYTHONPATH: /opt/vedicway:/opt/vedicway/backend/src
    secrets:
      - postgres_password
      - codex_auth
      - vedicway_seo_agent_token
      - yandex_search_api_key
      - yandex_folder_id
      - yandex_webmaster_token
      - yandex_metrika_token
      - vedicway_vk_group_access_token
      - vedicway_vk_user_access_token
    volumes:
      - seo_agent_data:/var/lib/vedicway/seo-agent
      - seo_codex_home:/var/lib/vedicway/seo-codex-home
    networks:
      - edge
      - data
      - seo-egress
      - seo-browser
    depends_on:
      backend:
        condition: service_healthy
      vedicway-seo-browser-dzen:
        condition: service_healthy
      vedicway-seo-browser-pinterest:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=1770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    init: true
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          DATABASE_URL="$$(python -c 'import os,pathlib,urllib.parse;
          p=urllib.parse.quote(pathlib.Path(os.environ["POSTGRES_PASSWORD_FILE"]).read_text().rstrip("\r\n"),safe="");
          u=urllib.parse.quote(os.environ.get("POSTGRES_USER","vedicway"),safe="");
          d=urllib.parse.quote(os.environ.get("POSTGRES_DB","vedicway"),safe="");
          h=os.environ.get("POSTGRES_HOST","postgres");
          q=os.environ.get("POSTGRES_PORT","5432");
          print(f"postgresql+psycopg://{u}:{p}@{h}:{q}/{d}")')";
          export DATABASE_URL;
          exec python -m seo_agent.cli health
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  vedicway-seo-browser-dzen:
    image: ${VEDICWAY_BROWSER_IMAGE:-vedicway-browser}:${VEDICWAY_BROWSER_RELEASE_TAG:-latest}
    profiles: ["seo"]
    entrypoint: ["/usr/local/bin/vedicway-browser-login"]
    environment:
      VEDICWAY_BROWSER_PROFILE_NAME: vedicway-dzen
      VEDICWAY_BROWSER_USER_DATA_DIR: /var/lib/vedicway/browser-profile
      VEDICWAY_BROWSER_CDP_PORT: "9222"
      VEDICWAY_BROWSER_CDP_PROXY_PORT: "9322"
      VEDICWAY_BROWSER_START_URL: https://dzen.ru/profile/editor/create
      VEDICWAY_BROWSER_HEADLESS: "0"
      VEDICWAY_BROWSER_FINGERPRINT_SEED: "41001"
    volumes:
      - ${VEDICWAY_BROWSER_DATA_ROOT:-/var/lib/vedicway-browser}/dzen:/var/lib/vedicway/browser-profile
    secrets:
      - vedicway_browser_vnc_password
    ports:
      - "127.0.0.1:${VEDICWAY_DZEN_NOVNC_PORT:-6081}:6080"
    networks:
      - seo-browser
      - seo-egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=1770
      - /tmp/.X11-unix:rw,nosuid,nodev,size=1m,uid=0,gid=0,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    init: true
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "node -e \"Promise.all([fetch('http://127.0.0.1:9222/json/version'),fetch('http://127.0.0.1:9322/json/version'),fetch('http://127.0.0.1:6080/vnc.html')]).then(rs=>{if(rs.some(r=>!r.ok))process.exit(1)}).catch(()=>process.exit(1))\" && netstat -ltn | grep -q '127.0.0.1:5900'"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5
    restart: unless-stopped

  vedicway-seo-browser-pinterest:
    image: ${VEDICWAY_BROWSER_IMAGE:-vedicway-browser}:${VEDICWAY_BROWSER_RELEASE_TAG:-latest}
    profiles: ["seo"]
    entrypoint: ["/usr/local/bin/vedicway-browser-login"]
    environment:
      VEDICWAY_BROWSER_PROFILE_NAME: vedicway-pinterest
      VEDICWAY_BROWSER_USER_DATA_DIR: /var/lib/vedicway/browser-profile
      VEDICWAY_BROWSER_CDP_PORT: "9225"
      VEDICWAY_BROWSER_CDP_PROXY_PORT: "9325"
      VEDICWAY_BROWSER_START_URL: https://ru.pinterest.com/login/
      VEDICWAY_BROWSER_HEADLESS: "0"
      VEDICWAY_BROWSER_FINGERPRINT_SEED: "41004"
    volumes:
      - ${VEDICWAY_BROWSER_DATA_ROOT:-/var/lib/vedicway-browser}/pinterest:/var/lib/vedicway/browser-profile
    secrets:
      - vedicway_browser_vnc_password
    ports:
      - "127.0.0.1:${VEDICWAY_PINTEREST_NOVNC_PORT:-6082}:6080"
    networks:
      - seo-browser
      - seo-egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=1770
      - /tmp/.X11-unix:rw,nosuid,nodev,size=1m,uid=0,gid=0,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    init: true
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "node -e \"Promise.all([fetch('http://127.0.0.1:9225/json/version'),fetch('http://127.0.0.1:9325/json/version'),fetch('http://127.0.0.1:6080/vnc.html')]).then(rs=>{if(rs.some(r=>!r.ok))process.exit(1)}).catch(()=>process.exit(1))\" && netstat -ltn | grep -q '127.0.0.1:5900'"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5
    restart: unless-stopped

  email:
    <<: *backend-common
    command: ["python", "-m", "vedicway_backend.email_worker"]
    environment:
      <<: *backend-environment
      VEDICWAY_SECRET_PROFILE: email
      VEDICWAY_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    secrets:
      - postgres_password
      - vedicway_data_key
      - vedicway_signing_key
      - smtp_password
    configs: []
    volumes:
      - runtime_data:/var/lib/vedicway/data
    networks:
      - data
      - email-egress
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1770
    pids_limit: 64
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  retention-dry-run:
    <<: *lifecycle-common
    command: ["python", "/opt/vedicway/backend/scripts/data_lifecycle.py", "--dry-run"]

  retention-apply:
    <<: *lifecycle-common
    command: ["python", "/opt/vedicway/backend/scripts/data_lifecycle.py", "--apply"]

  frontend:
    image: ${FRONTEND_IMAGE:-vedicway-frontend}:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_PUBLIC_ORIGIN: ${VEDICWAY_PUBLIC_ORIGIN:-}
        VITE_YANDEX_METRIKA_ID: ${VITE_YANDEX_METRIKA_ID:-}
    ports:
      - "${PUBLIC_HTTP_BIND:-127.0.0.1}:${PUBLIC_HTTP_PORT:-8080}:8080"
    networks:
      - edge
      - loopback
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=101,gid=101,mode=1770
      - /tmp/nginx:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 20s

  # Starts only for an authenticated support session. The loopback binding is
  # reached through an SSH/VPN bastion; no public reverse proxy routes here.
  ops-gateway:
    image: ${FRONTEND_IMAGE:-vedicway-frontend}:${RELEASE_TAG:-local}
    profiles: ["ops"]
    ports:
      - "${OPS_HTTP_BIND:-127.0.0.1}:${OPS_HTTP_PORT:-8081}:8081"
    volumes:
      - ./docker/nginx/ops.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ops
      - loopback
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101,mode=1770
      - /tmp/nginx:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    restart: "no"

  backup:
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    profiles: ["ops"]
    entrypoint: ["/bin/sh", "/opt/vedicway/backup.sh"]
    user: "10001:10001"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-vedicway}
      POSTGRES_USER: ${POSTGRES_USER:-vedicway}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      BACKUP_DIR: /backups
      BACKUP_SET_ID: ${BACKUP_SET_ID:-}
    secrets:
      - postgres_password
    volumes:
      - ./backups:/backups
      - ./docker/postgres/backup.sh:/opt/vedicway/backup.sh:ro
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  restore:
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    profiles: ["ops"]
    entrypoint: ["/bin/sh", "/opt/vedicway/restore.sh"]
    user: "10001:10001"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-vedicway}
      POSTGRES_USER: ${POSTGRES_USER:-vedicway}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      BACKUP_DIR: ${RESTORE_BACKUP_DIR:-/backups}
      RESTORE_FILE: ${RESTORE_FILE:-}
      CONFIRM_RESTORE: ${CONFIRM_RESTORE:-}
      RESTORE_SET_ID: ${RESTORE_SET_ID:-}
      RESTORE_PHASE: ${RESTORE_PHASE:-prepare}
    secrets:
      - postgres_password
    volumes:
      - ./backups:/backups:ro
      - ./docker/postgres/restore.sh:/opt/vedicway/restore.sh:ro
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  runtime-backup:
    image: ${BACKEND_IMAGE:-vedicway-backend}:${RELEASE_TAG:-local}
    profiles: ["ops"]
    entrypoint: ["python", "/opt/vedicway/backend/scripts/runtime_backup.py"]
    command: ["backup"]
    user: "10001:10001"
    environment:
      BACKUP_SET_ID: ${BACKUP_SET_ID:-}
    volumes:
      - runtime_data:/var/lib/vedicway/data:ro
      - media_data:/var/lib/vedicway/media:ro
      - ./backups:/backups
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=1770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  backup-bundle:
    image: ${BACKEND_IMAGE:-vedicway-backend}:${RELEASE_TAG:-local}
    profiles: ["ops"]
    entrypoint: ["python", "/opt/vedicway/backend/scripts/backup_bundle.py"]
    user: "10001:10001"
    environment:
      BACKUP_DIR: /backups
      BACKUP_SET_ID: ${BACKUP_SET_ID:-}
      BACKUP_BUNDLE_FILE: ${BACKUP_BUNDLE_FILE:-}
      BACKUP_KEY_FILE: /run/secrets/backup_encryption_key
      POSTGRES_DB: ${POSTGRES_DB:-vedicway}
    secrets:
      - backup_encryption_key
    volumes:
      - ./backups:/backups
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=1770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  runtime-restore:
    image: ${BACKEND_IMAGE:-vedicway-backend}:${RELEASE_TAG:-local}
    profiles: ["ops"]
    entrypoint: ["python", "/opt/vedicway/backend/scripts/runtime_backup.py"]
    command: ["restore"]
    user: "10001:10001"
    environment:
      BACKUP_DIR: ${RESTORE_BACKUP_DIR:-/backups}
      RESTORE_RUNTIME_FILE: ${RESTORE_RUNTIME_FILE:-}
      CONFIRM_RUNTIME_RESTORE: ${CONFIRM_RUNTIME_RESTORE:-}
      RESTORE_SET_ID: ${RESTORE_SET_ID:-}
    volumes:
      - runtime_data:/var/lib/vedicway/data
      - media_data:/var/lib/vedicway/media
      - ./backups:/backups:ro
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=1770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

networks:
  edge:
    internal: true
    ipam:
      config:
        - subnet: ${VEDICWAY_DOCKER_SUBNET:-172.29.0.0/24}
  data:
    internal: true
  email-egress:
  ops:
    internal: true
    ipam:
      config:
        - subnet: ${VEDICWAY_OPS_DOCKER_SUBNET:-172.30.0.0/28}
  # A non-internal gateway is required for Docker to publish loopback-only ports.
  loopback:
    ipam:
      config:
        - subnet: ${VEDICWAY_LOOPBACK_DOCKER_SUBNET:-172.22.0.0/16}
  # Docker Compose cannot enforce an HTTPS hostname allowlist. These networks
  # separate API and worker egress so the host firewall/proxy can police them.
  api-egress:
  worker-egress:
  seo-egress:
  seo-browser:
    internal: true

volumes:
  postgres_data:
  runtime_data:
  media_data:
  seo_agent_data:
  seo_codex_home:

configs:
  places:
    file: ${VEDICWAY_PLACE_DATASET_FILE:?Set VEDICWAY_PLACE_DATASET_FILE to the licensed local JSON registry}

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password.txt}
  vedicway_data_key:
    file: ${VEDICWAY_DATA_KEY_FILE:-./secrets/vedicway_data_key.txt}
  vedicway_signing_key:
    file: ${VEDICWAY_SIGNING_KEY_FILE:-./secrets/vedicway_signing_key.txt}
  vedicway_operations_token:
    file: ${VEDICWAY_OPERATIONS_TOKEN_FILE:-./secrets/vedicway_operations_token.txt}
  vedicway_metrics_token:
    file: ${VEDICWAY_METRICS_TOKEN_FILE:-./secrets/vedicway_metrics_token.txt}
  vedicway_seo_agent_token:
    file: ${VEDICWAY_SEO_AGENT_TOKEN_FILE:-./secrets/vedicway_seo_agent_token.txt}
  vedicway_browser_vnc_password:
    file: ${VEDICWAY_BROWSER_VNC_PASSWORD_FILE:-./secrets/vedicway_browser_vnc_password.txt}
  yandex_search_api_key:
    file: ${VEDICWAY_YANDEX_SEARCH_API_KEY_FILE:-./secrets/vedicway_yandex_search_api_key.txt}
  yandex_folder_id:
    file: ${VEDICWAY_YANDEX_FOLDER_ID_FILE:-./secrets/vedicway_yandex_folder_id.txt}
  yandex_webmaster_token:
    file: ${VEDICWAY_YANDEX_WEBMASTER_TOKEN_FILE:-./secrets/vedicway_yandex_webmaster_token.txt}
  yandex_metrika_token:
    file: ${VEDICWAY_YANDEX_METRIKA_TOKEN_FILE:-./secrets/vedicway_yandex_metrika_token.txt}
  vedicway_vk_group_access_token:
    file: ${VEDICWAY_VK_GROUP_ACCESS_TOKEN_FILE:-./secrets/vedicway_vk_group_access_token.txt}
  vedicway_vk_user_access_token:
    file: ${VEDICWAY_VK_USER_ACCESS_TOKEN_FILE:-./secrets/vedicway_vk_user_access_token.txt}
  yookassa_shop_id:
    file: ${YOOKASSA_SHOP_ID_FILE:-./secrets/yookassa_shop_id.txt}
  yookassa_secret_key:
    file: ${YOOKASSA_SECRET_KEY_FILE:-./secrets/yookassa_secret_key.txt}
  codex_auth:
    file: ${CODEX_AUTH_FILE:-./secrets/codex_auth.json}
  smtp_password:
    file: ${VEDICWAY_SMTP_PASSWORD_FILE:-./secrets/smtp_password.txt}
  backup_encryption_key:
    file: ${VEDICWAY_BACKUP_KEY_FILE:-./secrets/backup_encryption_key.txt}
