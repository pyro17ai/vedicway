stream {
    map $ssl_preread_protocol $vedicway_port_80_upstream {
        "" 127.0.0.1:8082;
        default 127.0.0.1:8443;
    }

    server {
        listen 80;
        listen [::]:80;
        proxy_pass $vedicway_port_80_upstream;
        proxy_protocol on;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;
        ssl_preread on;
    }
}
