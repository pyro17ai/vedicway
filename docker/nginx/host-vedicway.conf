server {
    listen 8082 proxy_protocol default_server;
    listen [::]:8082 proxy_protocol default_server;
    server_name _;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

server {
    listen 8082 proxy_protocol;
    listen [::]:8082 proxy_protocol;
    server_name vedicway.ru www.vedicway.ru;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vedicway.ru www.vedicway.ru;

    server_tokens off;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/vedicway.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vedicway.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}

server {
    listen 8443 ssl proxy_protocol;
    listen [::]:8443 ssl proxy_protocol;
    server_name origin.vedicway.ru;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    server_tokens off;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/vedicway.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vedicway.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host vedicway.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 360s;
    }
}
