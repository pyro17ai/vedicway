worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;

  client_body_temp_path /tmp/nginx/client_temp;
  proxy_temp_path /tmp/nginx/proxy_temp;
  fastcgi_temp_path /tmp/nginx/fastcgi_temp;
  uwsgi_temp_path /tmp/nginx/uwsgi_temp;
  scgi_temp_path /tmp/nginx/scgi_temp;

  log_format main '[$time_iso8601] "$request_method $server_protocol" '
                  '$status $body_bytes_sent request_id=$request_id request_time=$request_time';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  server_tokens off;
  client_max_body_size 16m;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/csv text/xml application/json application/javascript application/manifest+json application/xml application/rss+xml image/svg+xml;

  map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
    http http;
  }

  map $forwarded_proto $strict_transport_security {
    default "";
    https "max-age=31536000; includeSubDomains";
  }

  map $uri $x_robots_tag {
    default "";
    ~^/api(?:/|$) "noindex, nofollow, noarchive";
    ~^/internal(?:/|$) "noindex, nofollow, noarchive";
    ~^/chart(?:/|$) "noindex, nofollow, noarchive";
    ~^/access/recovery/?$ "noindex, nofollow, noarchive";
    ~^/access/confirm/?$ "noindex, nofollow, noarchive";
    ~^/privacy/request/?$ "noindex, nofollow, noarchive";
    ~^/(?:checkout|payment)(?:/|$) "noindex, nofollow, noarchive";
  }

  map $uri $referrer_policy {
    default "strict-origin-when-cross-origin";
    ~^/access/confirm/?$ "no-referrer";
  }

  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream vedicway_backend {
    zone vedicway_backend 64k;
    server backend:8000 resolve;
    keepalive 16;
  }

  server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "$referrer_policy" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "$strict_transport_security" always;
    add_header X-Robots-Tag "$x_robots_tag" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://mc.yandex.ru https://mc.yandex.com https://yastatic.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://mc.yandex.ru https://mc.yandex.com; connect-src 'self' https://geocoding-api.open-meteo.com https://mc.yandex.ru https://mc.yandex.com wss://mc.yandex.ru wss://mc.yandex.com; form-action 'self' https://yookassa.ru https://*.yookassa.ru https://yoomoney.ru; frame-src https://mc.yandex.ru https://mc.yandex.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self'" always;

    error_page 404 /404.html;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location ^~ /internal/ {
      return 404;
    }

    location ~ ^/api/v1/charts/[^/]+/events$ {
      proxy_pass http://vedicway_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Request-ID $request_id;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }

    location ^~ /api/v1/magic-links/ {
      access_log off;
      proxy_pass http://vedicway_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_buffering off;
    }

    location /api/ {
      proxy_pass http://vedicway_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 5s;
      proxy_send_timeout 180s;
      proxy_read_timeout 180s;
      proxy_request_buffering on;
      proxy_buffering on;
    }

    location ^~ /media/articles/ {
      proxy_pass http://vedicway_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      expires 1y;
    }

    location = /guide {
      proxy_pass http://vedicway_backend/internal/seo/guide/page;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
      proxy_intercept_errors on;
      error_page 404 =404 /404.html;
    }

    location = /guide/ {
      return 308 /guide;
    }

    location ~ ^/guide/(?<article_slug>[a-z0-9]+(?:-[a-z0-9]+)*)/$ {
      return 308 /guide/$article_slug;
    }

    location ~ ^/guide/(?<article_slug>[a-z0-9]+(?:-[a-z0-9]+)*)$ {
      proxy_pass http://vedicway_backend/internal/seo/guide/articles/$article_slug/page;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
      proxy_intercept_errors on;
      error_page 404 =404 /404.html;
    }

    location = /blog {
      proxy_pass http://vedicway_backend/internal/seo/blog/page;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
      proxy_intercept_errors on;
      error_page 404 =404 /404.html;
    }

    location = /blog/ {
      return 308 /blog;
    }

    location ~ ^/blog/(?<blog_article_slug>[a-z0-9]+(?:-[a-z0-9]+)*)/$ {
      return 308 /blog/$blog_article_slug;
    }

    location ~ ^/blog/(?<blog_article_slug>[a-z0-9]+(?:-[a-z0-9]+)*)$ {
      proxy_pass http://vedicway_backend/internal/seo/blog/articles/$blog_article_slug/page;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
      proxy_intercept_errors on;
      error_page 404 =404 /404.html;
    }

    location = /assets/seo-entry.js {
      try_files $uri =404;
      expires -1;
    }

    location = /assets/seo-entry.css {
      try_files $uri =404;
      expires -1;
    }

    location ~ ^/chart/[^/]+/?$ {
      try_files /index.html =404;
      expires -1;
    }

    location = /legal/offer { try_files /legal/offer/index.html =404; expires -1; }
    location = /legal/privacy { try_files /legal/privacy/index.html =404; expires -1; }
    location = /legal/user-agreement { try_files /legal/user-agreement/index.html =404; expires -1; }
    location = /legal/privacy-policy { try_files /legal/privacy-policy/index.html =404; expires -1; }
    location = /legal/personal-data-consent { try_files /legal/personal-data-consent/index.html =404; expires -1; }
    location = /legal/cookies { try_files /legal/cookies/index.html =404; expires -1; }
    location = /legal/offer/ { return 308 /legal/offer; }
    location = /legal/privacy/ { return 308 /legal/privacy; }
    location = /legal/user-agreement/ { return 308 /legal/user-agreement; }
    location = /legal/privacy-policy/ { return 308 /legal/privacy-policy; }
    location = /legal/personal-data-consent/ { return 308 /legal/personal-data-consent; }
    location = /legal/cookies/ { return 308 /legal/cookies; }
    location ^~ /legal/ { return 404; }

    location = /access/recovery {
      try_files /access/recovery/index.html =404;
      expires -1;
    }

    location = /access/confirm {
      try_files /access/confirm/index.html =404;
      expires -1;
    }

    location = /privacy/request {
      try_files /privacy/request/index.html =404;
      expires -1;
    }

    location = /sitemap.xml {
      proxy_pass http://vedicway_backend/api/v1/seo/sitemap.xml;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 3s;
      proxy_read_timeout 10s;
      proxy_intercept_errors on;
      error_page 404 502 503 504 = /__static_sitemap.xml;
      expires 1h;
    }

    location = /feed/dzen.xml {
      proxy_pass http://vedicway_backend/api/v1/seo/dzen.xml;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 3s;
      proxy_read_timeout 10s;
      proxy_intercept_errors on;
      error_page 502 503 504 =503 /50x.html;
      expires 5m;
    }

    location = /__static_sitemap.xml {
      internal;
      alias /usr/share/nginx/html/sitemap.xml;
      expires 1h;
    }

    location ~* \.(?:js|css)$ {
      try_files $uri =404;
      expires 1y;
    }

    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
      try_files $uri =404;
      expires 30d;
    }

    location ~* ^/(?:robots\.txt|llms\.txt|site\.webmanifest)$ {
      try_files $uri =404;
      expires 1h;
    }

    location = /index.html {
      expires -1;
      try_files $uri =404;
    }

    location = /404.html {
      internal;
      expires -1;
      try_files /404.html =404;
    }

    location = / {
      expires -1;
      try_files /index.html =404;
    }

    location / {
      try_files $uri =404;
    }
  }
}
