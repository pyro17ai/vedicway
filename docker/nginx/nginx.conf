worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;

  client_body_temp_path /tmp/nginx/client_temp;
  proxy_temp_path /tmp/nginx/proxy_temp;
  fastcgi_temp_path /tmp/nginx/fastcgi_temp;
  uwsgi_temp_path /tmp/nginx/uwsgi_temp;
  scgi_temp_path /tmp/nginx/scgi_temp;

  log_format main '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent request_id=$request_id request_time=$request_time';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  server_tokens off;
  client_max_body_size 16m;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/csv text/xml application/json application/javascript application/manifest+json application/xml application/rss+xml image/svg+xml;

  map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
    http http;
  }

  map $forwarded_proto $strict_transport_security {
    default "";
    https "max-age=31536000; includeSubDomains";
  }

  map $uri $x_robots_tag {
    default "";
    ~^/admin(?:/|$) "noindex, nofollow, noarchive";
    ~^/api(?:/|$) "noindex, nofollow, noarchive";
    ~^/internal(?:/|$) "noindex, nofollow, noarchive";
    ~^/chart(?:/|$) "noindex, nofollow, noarchive";
    ~^/guide/editor/?$ "noindex, nofollow, noarchive";
    ~^/(?:checkout|payment)(?:/|$) "noindex, nofollow, noarchive";
  }

  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream vedicway_backend {
    zone vedicway_backend 64k;
    server backend:8000 resolve;
    keepalive 16;
  }

  server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "$strict_transport_security" always;
    add_header X-Robots-Tag "$x_robots_tag" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://mc.yandex.ru https://mc.yandex.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://mc.yandex.ru https://mc.yandex.com; connect-src 'self' https://geocoding-api.open-meteo.com https://mc.yandex.ru https://mc.yandex.com wss://mc.yandex.ru wss://mc.yandex.com; form-action 'self' https://yookassa.ru https://*.yookassa.ru https://yoomoney.ru; frame-src https://mc.yandex.ru https://mc.yandex.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self'" always;

    error_page 404 /404.html;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location ^~ /internal/ {
      return 404;
    }

    location ~ ^/api/v1/charts/[^/]+/events$ {
      proxy_pass http://vedicway_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Request-ID $request_id;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }

    location /api/ {
      proxy_pass http://vedicway_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 5s;
      proxy_send_timeout 180s;
      proxy_read_timeout 180s;
      proxy_request_buffering on;
      proxy_buffering on;
    }

    location ^~ /media/articles/ {
      proxy_pass http://vedicway_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      expires 1y;
    }

    location = /guide {
      try_files /guide/index.html =404;
    }

    location = /guide/ {
      return 308 /guide;
    }

    location ~ ^/guide/[^/]+/?$ {
      try_files $uri $uri/index.html /index.html;
      expires -1;
    }

    location ~ ^/chart/[^/]+/?$ {
      try_files /index.html =404;
      expires -1;
    }

    location ~ ^/legal(?:/.*)?$ {
      try_files $uri $uri/index.html /index.html;
      expires -1;
    }

    location ~ ^/admin(?:/.*)?$ {
      try_files /index.html =404;
      expires -1;
    }

    location = /sitemap.xml {
      proxy_pass http://vedicway_backend/api/v1/seo/sitemap.xml;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 3s;
      proxy_read_timeout 10s;
      proxy_intercept_errors on;
      error_page 404 502 503 504 = /__static_sitemap.xml;
      expires 1h;
    }

    location = /__static_sitemap.xml {
      internal;
      alias /usr/share/nginx/html/sitemap.xml;
      expires 1h;
    }

    location ~* \.(?:js|css)$ {
      try_files $uri =404;
      expires 1y;
    }

    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
      try_files $uri =404;
      expires 30d;
    }

    location ~* ^/(?:robots\.txt|llms\.txt|site\.webmanifest)$ {
      try_files $uri =404;
      expires 1h;
    }

    location = /index.html {
      expires -1;
      try_files $uri =404;
    }

    location = /404.html {
      internal;
      expires -1;
      try_files /404.html =404;
    }

    location = / {
      expires -1;
      try_files /index.html =404;
    }

    location / {
      try_files $uri =404;
    }
  }
}
