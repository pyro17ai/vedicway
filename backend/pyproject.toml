[project]
name = "vedicway-backend"
version = "0.1.0"
description = "VedicWay chart-result BFF and deterministic calculation workflow"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "cryptography>=46.0,<50.0",
  "email-validator>=2.2,<3.0",
  "fastapi==0.128.0",
  "httpx>=0.28,<1.0",
  "pillow>=11.0,<13.0",
  "pydantic>=2.13,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "sqlalchemy>=2.0.38,<3.0",
  "tzdata>=2025.2,<2027.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
  "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
