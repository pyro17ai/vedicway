name: production-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:run
      - run: npm run build
      - run: node scripts/prerender-seo.mjs
      - name: Verify prerendered public routes
        run: test -s dist/index.html && test -s dist/guide/index.html && test -s dist/404.html && test -s dist/robots.txt && test -s dist/sitemap.xml
      - name: Build non-root frontend image
        run: docker build --file docker/frontend/Dockerfile --tag vedicway-frontend:ci .

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
        env:
          POSTGRES_DB: vedicway_ci
          POSTGRES_USER: vedicway_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vedicway_ci -d vedicway_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vedicway_ci:ci-only-password@127.0.0.1:5432/vedicway_ci
      VEDICWAY_DATABASE_URL: postgresql+psycopg://vedicway_ci:ci-only-password@127.0.0.1:5432/vedicway_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "./backend[test]"
      - name: Apply and verify production database migrations
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          printf 'ci-only-password' > /tmp/vedicway-postgres-password
          chmod 600 /tmp/vedicway-postgres-password
          POSTGRES_HOST=127.0.0.1 POSTGRES_DB=vedicway_ci POSTGRES_USER=vedicway_ci POSTGRES_PASSWORD_FILE=/tmp/vedicway-postgres-password sh docker/postgres/run-migrations.sh
          (cd backend && python -m alembic -c alembic.ini upgrade head)
          python -c "from vedicway_backend.content_store import ContentDatabase; ContentDatabase().ping(require_migrations=True)"
          rm -f /tmp/vedicway-postgres-password
      - run: python -m ruff check --config backend/pyproject.toml backend/src backend/tests backend/scripts/runtime_backup.py backend/scripts/bootstrap_admin.py scripts/check_production_release.py scripts/check_compose_contract.py scripts/check_nginx_contract.py
      - run: python -m pytest backend/tests
      - run: python -m py_compile scripts/check_production_release.py scripts/check_compose_contract.py scripts/check_nginx_contract.py backend/scripts/runtime_backup.py backend/scripts/bootstrap_admin.py

  release-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret config fixtures
        run: |
          cp .env.production.example .env.production
          mkdir -p runtime/pyjhora-wheelhouse secrets
          printf '{"places":[{"place_id":"ci","display_name":"CI","country_code":"RU","latitude":0,"longitude":0,"tzid":"UTC"}]}' > runtime/places.json
          touch runtime/pyjhora-wheelhouse/SHA256SUMS
          for file in postgres_password vedicway_data_key vedicway_signing_key vedicway_operations_token vedicway_metrics_token yookassa_shop_id yookassa_secret_key codex_api_key; do
            printf 'ci-placeholder-not-a-real-secret-00000000000000000000' > "secrets/${file}.txt"
          done
      - name: Validate shell and YAML syntax
        run: |
          sh -n docker/backend/entrypoint.sh
          sh -n docker/backend/run-alembic.sh
          sh -n docker/postgres/run-migrations.sh
          sh -n docker/postgres/backup.sh
          sh -n docker/postgres/restore.sh
          docker compose --env-file .env.production -f compose.production.yml config --format json > /tmp/vedicway-compose.json
          python scripts/check_compose_contract.py /tmp/vedicway-compose.json
          python scripts/check_nginx_contract.py docker/nginx/nginx.conf
      - name: Static Dockerfile checks
        run: |
          docker buildx build --check --file docker/frontend/Dockerfile .
          docker buildx build --check --build-context pyjhora=runtime/pyjhora-wheelhouse --file docker/backend/Dockerfile .
